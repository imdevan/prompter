# Locations
prompts_location = "$XDG_DATA_HOME/prompter/prompts"
history_location = "$XDG_CACHE_HOME/prompter/history"
local_prompts_location = "prompts"

# Templates & agents
# include_agents options: all, none, agents, kiro, cursor, opencode
include_agents = "all"
editor = "nvim"
# directory_strategy options: git (tracked files), filesystem (walk directory, uses .gitignore when present)
directory_strategy = "git"

# CLI behavior
interactive_default = true
show_base_prompt_input = true
alt_enter_submit = false
include_builtin_shorthand = true

# Output
# target options: clipboard, stdout, file:/path, editor
target = "clipboard"

# History
# history_clear_cycle options: never, 1, 7, 31 (days)
history_clear_cycle = "never"
history_file_format = "month-day_eu"
history_enable_time_ago = true
# history_date_time options: day, month; month, day; iso; or a Go time layout
history_date_time = "day, month"
disable_history = false
prompt_separator = "---"

# Colors
# Colors support named, numeric, or hex values (ex: 7, 13, "#ff8800").
headings = "15"
primary = "02"
secondary = "06"
text = "07"
text_highlight = "06"
description_highlight = "05"
tags = "13"
flags = "12"
muted = "08"
base_prompt_badge = "06"
border = "08"

[remap_short_flags]
# Map long flags to a custom short flag (single letter).
# Existing short flags: A B D E F I T V Y
# Example: directory = "D"
